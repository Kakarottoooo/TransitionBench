name: CPU verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  recorded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install application and CPU test dependencies
        run: python -m pip install -e . pytest==8.4.1 pytest-asyncio==1.0.0
      - name: Test contracts without a GPU or provider key
        run: python -m pytest -m cpu tests -q
      - name: Independently recompute the sealed GPU records
        run: python scripts/verify_prospective_v4.py src/transitionbench/static/examples/independent-test/evidence.zip verified-v4
